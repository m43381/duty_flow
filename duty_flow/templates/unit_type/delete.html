{% extends 'cabinets/base_cabinet.html' %}

{% block cabinet_content %}
<div class="card" style="border-color: var(--danger);">
    <div class="card-header" style="background: var(--danger-bg);">
        <h2 class="card-title" style="color: var(--danger);">⚠️ {{ title }}</h2>
    </div>
    <div class="card-body">
        <p>Вы уверены, что хотите удалить тип подразделения?</p>
        
        <div class="info-grid" style="background: var(--bg-hover); padding: 1rem; border-radius: 0.5rem; margin: 1rem 0;">
            <div class="info-row">
                <span class="info-label">Название:</span>
                <span class="info-value">{{ item.name }}</span>
            </div>
            <div class="info-row">
                <span class="info-label">Слаг:</span>
                <span class="info-value"><code>{{ item.slug }}</code></span>
            </div>
            <div class="info-row">
                <span class="info-label">Уровень:</span>
                <span class="info-value">{{ item.level }}</span>
            </div>
        </div>
        
        <p style="color: var(--danger); margin-bottom: 1rem;">
            ⚠️ Это действие нельзя будет отменить!
        </p>
        
        <form method="post">
            {% csrf_token %}
            <div class="form-actions">
                <button type="submit" class="btn btn-danger">🗑️ Да, удалить</button>
                <a href="{% url 'unit_type:detail' item.pk %}" class="btn btn-secondary">↩️ Отмена</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
