{% extends 'cabinets/base_cabinet.html' %}

{% block cabinet_content %}
<div class="card">
    <div class="card-header">
        <h2>🔓 {{ title }}</h2>
    </div>
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Сохранить</button>
            <a href="{% url 'person:person_detail' person.pk %}?tab=exemptions" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
