{% extends 'cabinets/base_cabinet.html' %}

{% block cabinet_content %}
<div class="card" style="border-color: var(--danger);">
    <div class="card-header" style="background: var(--danger-bg);">
        <h2 class="card-title" style="color: var(--danger);">⚠️ {{ title }}</h2>
    </div>
    <div class="card-body">
        <p>Вы уверены, что хотите удалить это расписание?</p>
        
        <div class="info-grid" style="background: var(--bg-hover); padding: 1rem; border-radius: 0.5rem; margin: 1rem 0;">
            <div class="info-row">
                <span class="info-label">Месяц:</span>
                <span class="info-value">{{ item.month|date:"F Y" }}</span>
            </div>
            <div class="info-row">
                <span class="info-label">Название:</span>
                <span class="info-value">{{ item.name|default:"—" }}</span>
            </div>
        </div>
        
        <p style="color: var(--danger);">Это действие нельзя будет отменить!</p>
        
        <form method="post">
            {% csrf_token %}
            <div class="form-actions">
                <button type="submit" class="btn btn-danger">🗑️ Да, удалить</button>
                <a href="{% url 'plan:detail' item.pk %}" class="btn btn-secondary">↩️ Отмена</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
