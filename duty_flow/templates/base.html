{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- ИКОНКА САЙТА (favicon) -->
    <link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}">
    
    <title>{% block title %}DutyFlow{% endblock %}</title>
    
    <!-- ТЕМЫ -->
    <link rel="stylesheet" href="{% static 'css/themes/light.css' %}" id="theme-light">
    <link rel="stylesheet" href="{% static 'css/themes/dark.css' %}" id="theme-dark" disabled>
    
    <!-- ОСНОВНЫЕ СТИЛИ -->
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- КНОПКА ТЕМЫ -->
    <button class="theme-toggle" id="themeBtn">
        <span class="theme-icon-light">☀️</span>
        <span class="theme-icon-dark">🌙</span>
        <span class="theme-text">Сменить тему</span>
    </button>
    
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    
    <!-- СКРИПТ ТЕМЫ -->
    <script src="{% static 'js/components/theme.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
