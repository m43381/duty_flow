<div class="page-header">
    <div class="page-header__main">
        <h2 class="page-header__title">{{ page_title }}</h2>
        {% if page_subtitle %}
            <p class="page-header__subtitle">{{ page_subtitle }}</p>
        {% endif %}
    </div>

    {% if page_actions %}
        <div class="page-header__actions">
            {{ page_actions }}
        </div>
    {% endif %}
</div>
